# pre-commit.com integration
# Install: pip install pre-commit && pre-commit install

repos:
  - repo: local
    hooks:
      - id: auto-validator
        name: DBC/ARXML Validator
        entry: auto-validator hook-check --config configs/default.yaml
        language: system
        files: '\.(dbc|arxml)$'
        pass_filenames: true

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
