name: CI — DBC/ARXML Validator Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type check (mypy)
        run: mypy src/auto_validator
        continue-on-error: true

      - name: Unit + integration tests
        run: pytest -m "unit or integration" --cov=auto_validator --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  validate-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Validate known-good fixtures
        run: |
          auto-validator validate \
            --dbc tests/fixtures/dbc/valid_can.dbc \
            --arxml tests/fixtures/arxml/valid_swc.arxml \
            --requirements tests/fixtures/doors/requirements.csv \
            --config configs/default.yaml
      - name: Expect failure on overlapping DBC
        run: |
          if auto-validator validate --dbc tests/fixtures/dbc/invalid_overlap.dbc --skip-codegen; then
            echo "Expected validation failure for overlapping signals" >&2
            exit 1
          fi
